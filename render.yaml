# Blueprint Render pour l'API Taurge (le frontend va sur Vercel).
# Import : Render Dashboard -> New -> Blueprint -> sélectionner ce repo.
# Les variables marquées sync: false sont à remplir dans le Dashboard.
services:
  - type: web
    name: taurge-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # OCR (Paddle/Tesseract) a besoin de RAM : le plan gratuit (512 Mo)
    # risque l'OOM sur l'OCR. Standard (2 Go) recommandé en production.
    plan: standard
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # URL PostgreSQL (Render Postgres ou Neon)
      - key: SECRET_KEY
        sync: false # chaîne longue aléatoire, ex. openssl rand -hex 32
      - key: CORS_ORIGINS
        sync: false # ex. https://taurge.vercel.app
      - key: PUBLIC_APP_URL
        sync: false # ex. https://taurge.vercel.app
      - key: STORAGE_PATH
        value: /app/storage_data
      - key: DEEPL_API_KEY
        sync: false
      - key: DEEPL_API_BASE_URL
        value: https://api-free.deepl.com
    # Stockage persistant (uploads, pages nettoyées, exports) :
    # sans disque, le système de fichiers Render est éphémère et tout
    # disparaît au redéploiement. Décommentez (plan payant requis) :
    # disk:
    #   name: taurge-storage
    #   mountPath: /app/storage_data
    #   sizeGB: 10
